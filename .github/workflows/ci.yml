name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the PRs on top of one another, and
  # a filter on `main` left every intermediate level without any gate -- only
  # the secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two independent jobs instead of one sequence: the pull request waits for
# the slowest of them rather than for the sum of all steps. The branch
# rulesets require the `ubuntu` check, which aggregates them.
jobs:
  # `pnpm run checks`: typecheck, lint, format, knip, the backend and node
  # tests (one build), size, ratchet and sync.
  checks:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Builds and typechecks the frontend layer against the DMS layer from
      # the `@antelopejs/dms` devDependency: no running backend needed.
      - run: pnpm test:frontend

  # The single check the branch rulesets require: green only when every job
  # above succeeded.
  ubuntu:
    if: always()
    needs: [checks, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
