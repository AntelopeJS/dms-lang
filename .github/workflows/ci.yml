name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the PRs on top of one another, and
  # a filter on `main` left every intermediate level without any gate -- only
  # the secret scanner ran.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Parallel jobs on Linux and Windows: the pull request waits for
# the slowest of them rather than for the sum of all steps. The branch
# rulesets require the `ubuntu` check, which aggregates them.
jobs:
  # `pnpm run checks`: typecheck, lint, format, knip, the backend and node
  # tests (one build), size, ratchet and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
        playground/README.md
      cache-paths: |
        .antelope/cache
        ~/.cache/mongodb-binaries
      cache-key-files: |
        src/test/harness.ts
        pnpm-lock.yaml
      renovate-sync: false
      test-job: true
      windows: true
      # Builds and typechecks the frontend layer against the DMS layer from
      # the `@antelopejs/dms` devDependency: no running backend needed.
      extra-commands: pnpm test:frontend
      extra-commands-job: true
    permissions:
      contents: read

  # The single check the branch rulesets require: green only when every job
  # above succeeded.
  ubuntu:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
