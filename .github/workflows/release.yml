name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch"
          node -e '
            const pkg = require("./package.json");
            const assert = require("node:assert");
            assert.strictEqual(pkg.name, "@antelopejs/dms-lang");
            assert.strictEqual(pkg.repository?.url, "git+https://github.com/AntelopeJS/dms-lang.git");
            assert.strictEqual(pkg.publishConfig?.access, "public");
            assert.strictEqual(pkg.publishConfig?.provenance, true);
            assert.strictEqual(pkg.publishConfig?.registry, "https://registry.npmjs.org/");
          '

  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
